<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABAP 커리큘럼 Harmony A (대시보드) - Full Data</title>
<link rel="stylesheet" href="../../assets/common.css" />
<link rel="stylesheet" href="../../assets/shell.css" />
<script src="../../assets/common.js" defer></script>
<script src="../../assets/shell.js" defer></script>
<style>
  /* Custom overrides for the Dashboard layout */
  body[data-page-type="document"] { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; width: 100%; max-width: 100%; }
  
  /* Stage 7 Hero Header Styling (Fallback if not in shell.css) */
  .stage7-hero { 
    background: #1e293b; color: #fff; padding: 0 32px; height: 64px; 
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
  }
  .hero-brand .home-link { color: #fff; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .hero-meta { display: flex; gap: 16px; align-items: center; font-size: 0.85rem; color: #cbd5e1; }
  .parent-link { color: #38bdf8; text-decoration: none; font-weight: 700; }
  
  /* Layout Wrapper */
  .stage7-doc-layout { display: flex; flex: 1; overflow: hidden; width: 100%; margin: 0; padding: 0; }
  
  /* Left Sidebar (Master) */
  .md-sidebar {
    width: 320px; background: #ffffff; border-right: 1px solid #e2e8f0;
    display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
  }
  .md-sidebar-header { padding: 20px; background: #fff; border-bottom: 1px solid #f1f5f9; }
  .md-sidebar-header h2 { margin: 0 0 16px 0; font-size: 1.1rem; color: #0f172a; font-weight: 800; }
  .track-select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 700; background: #f8fafc; color: #1e293b; }
  .search-input { width: 100%; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; background: #f8fafc; box-sizing: border-box; }
  
  .md-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .md-list::-webkit-scrollbar { width: 6px; }
  .md-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .md-list-item {
    padding: 16px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; background: #fff; transition: all 0.2s;
  }
  .md-list-item:hover { background: #f8fafc; border-color: #e2e8f0; }
  .md-list-item.active { background: #eff6ff; border-color: #bfdbfe; box-shadow: 0 4px 12px rgba(37,99,235,0.08); }
  .md-item-id { font-size: 0.75rem; font-weight: 900; color: #2563eb; margin-bottom: 6px; }
  .md-item-title { font-size: 1rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; line-height: 1.4; }
  
  /* Main Content (Detail) */
  .stage7-content { flex: 1; background: #f8fafc; overflow-y: auto; scroll-behavior: smooth; padding: 48px; position: relative; }
  .stage7-content::-webkit-scrollbar { width: 8px; }
  .stage7-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  
  .detail-eyebrow { display: inline-block; padding: 6px 16px; background: #e0e7ff; color: #2563eb; border-radius: 99px; font-size: 0.85rem; font-weight: 800; margin-bottom: 16px; }
  .detail-title { font-size: 2.2rem; font-weight: 900; color: #0f172a; margin: 0 0 24px; line-height: 1.2; }
  .detail-desc { font-size: 1.1rem; color: #475569; line-height: 1.6; margin-bottom: 40px; }
  
  /* Sub Level 1 Group */
  .sub1-group { margin-bottom: 48px; }
  .sub1-title { font-size: 1.5rem; font-weight: 800; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 24px; margin-top: 48px;}
  
  /* Unit Card (Sub Level 2) */
  .unit-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
    padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
  }
  .unit-card h4 { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin: 0 0 16px; }
  .unit-body h5 { font-size: 0.95rem; font-weight: 700; color: #475569; margin: 16px 0 8px; }
  .unit-body p { font-size: 0.95rem; color: #334155; line-height: 1.6; margin: 0 0 8px; }
  .unit-body ul { margin: 0 0 16px; padding-left: 20px; color: #334155; font-size: 0.95rem; line-height: 1.6; }
  .unit-alert { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-top: 16px; font-weight: 600; }
  
  /* Right Nav (Stage 7 Doc Nav) */
  .stage7-doc-nav {
    width: 260px; background: #ffffff; border-left: 1px solid #e2e8f0;
    padding: 32px 24px; overflow-y: auto; flex-shrink: 0;
  }
  .stage7-doc-nav h3 { font-size: 0.9rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 0 0 16px; }
  .toc-link {
    display: block; font-size: 0.9rem; font-weight: 600; color: #64748b;
    text-decoration: none; padding: 8px 0; transition: color 0.2s; border-bottom: 1px solid #f1f5f9;
  }
  .toc-link:hover { color: #2563eb; }
  .toc-link.sub { padding-left: 16px; font-size: 0.85rem; color: #94a3b8; border-bottom: none; }

  /* Terminology Popup */
  .term-popup {
    background: #eef2ff; color: #4338ca; border-bottom: 1px dashed #6366f1;
    cursor: help; font-weight: 700; position: relative; padding: 0 2px;
  }
  .term-popup:hover::after {
    content: attr(data-term-desc);
    position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 8px 12px; border-radius: 8px;
    font-size: 0.85rem; white-space: pre-wrap; width: max-content; max-width: 300px;
    z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-weight: 400;
  }
</style>
</head>
<body data-page-type="document">



  <!-- Stage 7 Layout Wrapper -->
  <div class="stage7-doc-layout">
    
    <!-- Master List Sidebar -->
    <aside class="md-sidebar">
      <div class="md-sidebar-header">
        <h2>트랙 선택</h2>
        <select id="trackSelect" class="track-select"></select>
        <input type="text" class="search-input" id="searchInput" placeholder="섹션 검색..." />
      </div>
      <div class="md-list" id="sectionList"></div>
    </aside>

    <!-- Main Content Detail -->
    <main class="stage7-content" id="detailContent">
      <!-- Renders here -->
    </main>

    <!-- Document Navigation Right Panel -->
    <aside class="stage7-doc-nav">
      <h3>In this section</h3>
      <div id="tocLinks"></div>
    </aside>
    
  </div>

<!-- Data Script -->
<script src="abap-curriculum-data.js"></script>
<script>
let currentTrackIdx = 0;
let activeSectionId = null;

// DOM
const trackSelect = document.getElementById('trackSelect');
const listEl = document.getElementById('sectionList');
const detailEl = document.getElementById('detailContent');
const searchInput = document.getElementById('searchInput');
const tocLinksEl = document.getElementById('tocLinks');

// Terminology Dictionary for tooltips
const dict = {
  "DDIC": "Data Dictionary: SAP 데이터베이스 구조를 관리하는 핵심 도구",
  "SE11": "ABAP Dictionary 트랜잭션 코드",
  "ADT": "ABAP Development Tools (Eclipse 기반)",
  "ALV": "ABAP List Viewer: 데이터를 격자 형태로 출력해주는 표준 컴포넌트",
  "RAP": "RESTful ABAP Programming Model: 최신 클라우드 기반 OData 서비스 개발 표준"
};

// Init
if (typeof curData !== 'undefined' && curData.tracks) {
  initTracks();
} else {
  detailEl.innerHTML = '<div style="text-align:center; padding: 64px;">데이터 로드 실패 (abap-curriculum-data.js 확인 필요)</div>';
}

function initTracks() {
  curData.tracks.forEach((track, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = track.track_id + " : " + track.track_name;
    trackSelect.appendChild(opt);
  });
  
  trackSelect.addEventListener('change', (e) => {
    currentTrackIdx = e.target.value;
    const sections = curData.tracks[currentTrackIdx].sections;
    activeSectionId = sections.length > 0 ? sections[0].section_id : null;
    renderList();
    renderDetail();
  });

  // initial load
  const sections = curData.tracks[0].sections;
  if(sections && sections.length > 0) activeSectionId = sections[0].section_id;
  renderList();
  renderDetail();
}

function renderList(filter = '') {
  listEl.innerHTML = '';
  const sections = curData.tracks[currentTrackIdx].sections;
  
  sections.forEach(sec => {
    if (filter && !sec.section_name.toLowerCase().includes(filter.toLowerCase()) && !sec.section_id.toLowerCase().includes(filter.toLowerCase())) return;
    
    const div = document.createElement('div');
    div.className = `md-list-item ${sec.section_id === activeSectionId ? 'active' : ''}`;
    div.innerHTML = `
      <div class="md-item-id">${sec.section_id}</div>
      <div class="md-item-title">${sec.section_name}</div>
    `;
    div.onclick = () => {
      activeSectionId = sec.section_id;
      renderList(filter);
      renderDetail();
    };
    listEl.appendChild(div);
  });
}

searchInput.addEventListener('input', (e) => {
  renderList(e.target.value);
});



function processTerms(text) {
  if(!text) return '';
  if(Array.isArray(text)) text = text.join('<br/>');
  let res = text;
  Object.keys(dict).forEach(term => {
    const regex = new RegExp(`\\b${term}\\b`, 'g');
    res = res.replace(regex, `<span class="term-popup" data-term-desc="${dict[term]}">${term}</span>`);
  });
  return res;
}

function renderDetail() {
  const sections = curData.tracks[currentTrackIdx].sections;
  const sec = sections.find(s => s.section_id === activeSectionId);
  if(!sec) return;
  
  let html = `
    <div class="detail-eyebrow">${sec.section_id}</div>
    <h2 class="detail-title">${sec.section_name}</h2>
    <p class="detail-desc">${processTerms(sec.section_goal?.ko || '')}</p>
  `;
  
  let tocHtml = '';
  
  if(sec.sub_levels_1 && sec.sub_levels_1.length > 0) {
    sec.sub_levels_1.forEach(sub1 => {
      tocHtml += `<a href="#${sub1.sub_1_id}" class="toc-link">${sub1.sub_1_name}</a>`;
      html += `<div class="sub1-group" id="${sub1.sub_1_id}">`;
      html += `<h3 class="sub1-title">${sub1.sub_1_name}</h3>`;
      
      if(sub1.sub_levels_2 && sub1.sub_levels_2.length > 0) {
        sub1.sub_levels_2.forEach(sub2 => {
          tocHtml += `<a href="#${sub2.sub_2_id}" class="toc-link sub">${sub2.sub_2_name}</a>`;
          
          html += `
            <div class="unit-card" id="${sub2.sub_2_id}">
              <h4>${sub2.sub_2_name}</h4>
              <div class="unit-body">
                ${sub2.learning_objectives?.ko ? `<h5>🎯 학습 목표</h5><p>${processTerms(sub2.learning_objectives.ko)}</p>` : ''}
                
                ${sub2.learning_content_design?.ko ? `
                  <h5>📖 학습 내용</h5>
                  <ul>
                    ${sub2.learning_content_design.ko.map(line => `<li>${processTerms(line)}</li>`).join('')}
                  </ul>
                ` : ''}
                
                ${sub2.hands_on_lab?.ko ? `<h5>💻 실습 가이드</h5><p>${processTerms(sub2.hands_on_lab.ko)}</p>` : ''}
                
                ${sub2.caution_points?.ko && sub2.caution_points.ko.length > 0 ? `
                  <div class="unit-alert">
                    <strong>⚠️ 주의 사항:</strong>
                    <ul style="margin-top:8px; margin-bottom:0;">
                      ${sub2.caution_points.ko.map(c => `<li>${processTerms(c)}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        });
      }
      html += `</div>`;
    });
  } else {
    html += `<div style="padding: 40px; text-align:center; color:#94a3b8;">하위 단위가 구성되지 않았습니다.</div>`;
  }
  
  detailEl.innerHTML = html;
  tocLinksEl.innerHTML = tocHtml;
  detailEl.scrollTop = 0;
}

</script>
</body>
</html>
