      "DDIC": "Data Dictionary: SAP 데이터베이스 구조를 관리하는 핵심 도구",

    };
  </script>

<script>
const trackSelect = document.getElementById('trackSelect');
const sidebarList = document.getElementById('sidebarList');
const detailContent = document.getElementById('detailContent');
const tocList = document.getElementById('tocList');
let observer = null;

if (typeof curData !== 'undefined' && curData.tracks) {
  initTracks();
} else {
  sidebarList.innerHTML = '<div style="padding: 20px; color: red;">데이터 로드 실패</div>';
}

function processTerms(text) {
  if(!text) return '';
  if(Array.isArray(text)) text = text.join('<br/>');
  let res = text;
  Object.keys(dict).forEach(term => {
    const regex = new RegExp(`\\b${term}\\b`, 'g');
    res = res.replace(regex, `<span class="term-popup" data-term-desc="${dict[term]}">${term}</span>`);
  });
  return res;
}

function initTracks() {
  curData.tracks.forEach((track, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = track.track_id + " : " + track.track_name;
    trackSelect.appendChild(opt);
  });
  
  renderSidebar(0);
  trackSelect.addEventListener('change', (e) => renderSidebar(e.target.value));
}

function renderSidebar(trackIdx) {
  sidebarList.innerHTML = '';
  const track = curData.tracks[trackIdx];
  
  track.sections.forEach((sec, idx) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div class="list-item-id">${sec.section_id}</div>
      <div class="list-item-title">${sec.section_name}</div>
    `;
    item.onclick = () => {
      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      renderDetail(sec);
    };
    sidebarList.appendChild(item);
  });
  
  // Select first section by default
  if(sidebarList.firstChild) sidebarList.firstChild.click();
}

function renderDetail(sec) {
  // Disconnect previous observer
  if (observer) {
    observer.disconnect();
    observer = null;
  }

  // 1. Render Main Content (Sample C Style)
  let html = `
    <div class="detail-header">
      <div class="detail-id">${sec.section_id}</div>
      <h2 class="detail-title">${sec.section_name}</h2>
      <p class="detail-desc">${processTerms(sec.section_goal?.ko || '')}</p>
    </div>
  `;
  
  let tocHtml = '';
  
  if (sec.sub_levels_1 && sec.sub_levels_1.length > 0) {
    sec.sub_levels_1.forEach((sub1, idx) => {
      const anchorId = 'sub1-' + idx;
      
      html += `
        <div class="sub1-group" id="${anchorId}" data-spy>
          <h3 class="sub1-title">${sub1.sub_1_name}</h3>
      `;
      
      tocHtml += `
        <li class="toc-item">
          <a href="#${anchorId}" class="toc-link" data-target="${anchorId}">${sub1.sub_1_name}</a>
        </li>
      `;
      
      if(sub1.sub_levels_2 && sub1.sub_levels_2.length > 0) {
        sub1.sub_levels_2.forEach(sub2 => {
          html += `
            <div class="sub2-box">
              <h4>${sub2.sub_2_name}</h4>
              ${sub2.learning_objectives?.ko ? `<p><strong>🎯 목표:</strong> ${processTerms(sub2.learning_objectives.ko)}</p>` : ''}
              
              ${sub2.learning_content_design?.ko ? `
                <p><strong>📖 내용:</strong></p>
                <ul>
                  ${sub2.learning_content_design.ko.map(line => `<li>${processTerms(line)}</li>`).join('')}
                </ul>
              ` : ''}
              
              ${sub2.caution_points?.ko && sub2.caution_points.ko.length > 0 ? `
                <div class="caution">
                  <strong>⚠️ 실무 주의사항:</strong>
                  <ul style="margin:4px 0 0; padding-left:16px;">
                    ${sub2.caution_points.ko.map(c => `<li>${processTerms(c)}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>
          `;
        });
      } else {
        html += `<p style="color:#94a3b8; font-size:0.95rem;">하위 단위가 구성되지 않았습니다.</p>`;
      }
      
      html += `</div>`;
    });
  } else {
    html += `<p style="color:#94a3b8; text-align:center; padding: 40px 0;">구성된 학습 내용이 없습니다.</p>`;
    tocHtml = `<li><a href="#" class="toc-link" style="color:#cbd5e1;">목차가 없습니다</a></li>`;
  }
  
  detailContent.innerHTML = html;
  tocList.innerHTML = tocHtml;
  
  // Reset Scroll
  document.getElementById('detailContentWrapper').scrollTop = 0;

  // 2. Setup Scroll Spy functionality using IntersectionObserver
  const spyElements = detailContent.querySelectorAll('[data-spy]');
  const tocLinks = tocList.querySelectorAll('.toc-link');

  // Add click behavior for smooth scrolling
  tocLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('data-target');
      if(targetId) {
        const targetEl = document.getElementById(targetId);
        if(targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  if (spyElements.length > 0 && "IntersectionObserver" in window) {
    const observerOptions = {
      root: document.getElementById('detailContentWrapper'),
      rootMargin: '-10% 0px -70% 0px', // Trigger when element is near top
      threshold: 0
    };

    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          // Highlight corresponding TOC link
          const id = entry.target.getAttribute('id');
          tocLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('data-target') === id) {
              link.classList.add('active');
            }
          });
        }
      });
    }, observerOptions);

    spyElements.forEach(el => observer.observe(el));
    
    // Highlight first item by default
    if(tocLinks.length > 0) {
      tocLinks[0].classList.add('active');
    }
  }
}
</script>
