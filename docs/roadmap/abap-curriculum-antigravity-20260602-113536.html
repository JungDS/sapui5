  }

  /* Top Header / Tabs */

  .md-header h1 {

    font-weight: 800;
    color: #0f172a;
    margin: 0;
    margin-right: 48px;
    letter-spacing: -0.02em;
  }

  .md-tabs {
    display: flex;
    gap: 16px;
    height: 100%;
  }

  .md-tab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 0 24px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #64748b;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .md-tab:hover {
    color: #0f172a;
    border-bottom-color: #cbd5e1;
  }

  .md-tab.active {
    color: var(--stage7-blue, #2563eb);
    border-bottom-color: var(--stage7-blue, #2563eb);
  }

  /* Main Body */
  .md-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left Sidebar (Master) */
  .md-sidebar {
    width: 400px;
    background: #ffffff;
    border-right: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .md-sidebar-header {
    padding: 24px 24px 12px 24px;
    background: #ffffff;
    font-size: 0.9rem;
    font-weight: 800;
    color: #475569;
    letter-spacing: 0.05em;

    flex: 1;
    overflow-y: auto;
    padding: 0 16px 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;

  .md-list-item {
    padding: 20px;

    border: 1px solid transparent;
    background: #ffffff;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

  .md-list-item:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);

  .md-list-item.active {
    background: #eff6ff;
    border-color: #bfdbfe;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }

  .md-item-id {
    font-size: 0.75rem;
    font-weight: 900;
    color: var(--stage7-blue, #2563eb);
    margin-bottom: 6px;
    letter-spacing: 0.05em;

    color: #1d4ed8;
  }

  .md-item-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .md-item-meta {
    display: flex;
    gap: 12px;
    font-size: 0.8rem;
    color: #64748b;
    font-weight: 600;
    align-items: center;

    overflow-y: auto;
    padding: 64px;
    position: relative;

  .md-content::-webkit-scrollbar-track { background: transparent; }
  .md-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    max-width: 900px;
    margin: 0 auto;

    color: #475569;
    line-height: 1.7;
    margin-bottom: 40px;

    margin-bottom: 48px;

  .kw-list {

  }

  .kw-tag {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #334155;

    background: #ffffff;

  .placeholder-header {
    border-bottom: 1px solid #f1f5f9;
    padding-bottom: 24px;
    margin-bottom: 32px;
  }

  .placeholder-header h3 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 800;
    color: #0f172a;
  }

  .placeholder-header p {
    margin: 8px 0 0 0;

    color: #64748b;

  .unit-mock-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .unit-mock-item {
    display: flex;
    align-items: center;

  }

  .unit-mock-item:hover {
    background: #f1f5f9;
  }

  .unit-mock-num {
    font-size: 1.2rem;
    font-weight: 900;
    color: #cbd5e1;
    width: 32px;
  }

  .unit-mock-text {
    flex: 1;
    height: 18px;
    background: #e2e8f0;
    border-radius: 6px;
    opacity: 0.6;
  }
  .unit-mock-text.short { width: 40%; }
  .unit-mock-text.medium { width: 70%; }
  .unit-mock-text.long { width: 90%; }

  .unit-mock-btn {
    width: 80px;
    height: 32px;
    background: #e2e8f0;
    border-radius: 8px;

  /* Empty State */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;

    height: 100%;

  }

    width: 64px;
    height: 64px;
    margin-bottom: 24px;
    opacity: 0.5;
  }
  .empty-state p {
    font-size: 1.2rem;
    font-weight: 700;

    { id: 'PRACTICAL-09', title: '성능 분석과 튜닝', desc: '측정 도구를 통해 병목을 확인하고 SQL/ITAB/로직을 개선한다.', time: '5.0시간', topics: 5, difficulty: '난이도 상', keywords: ['ST05', 'SQL Trace', 'SAT', 'SQL Monitor', 'SQLM'] },
    { id: 'PRACTICAL-10', title: 'AMDP / ADBC / Pushdown', desc: 'Open SQL/CDS로 부족한 고급 DB 처리의 판단 기준과 구현 방법을 다룬다.', time: '5.0시간', topics: 5, difficulty: '난이도 상', keywords: ['AMDP', 'SQLScript', 'Pushdown', 'Database Procedure'] },
    { id: 'PRACTICAL-11', title: 'Forms / Output / PDF', desc: '업무 장표 출력과 PDF 생성, 양식 변경 대응 흐름을 익힌다.', time: '5.0시간', topics: 5, difficulty: '난이도 상', keywords: ['Smart Forms', 'Adobe Forms', 'Form Interface', 'Output Control'] },
    { id: 'PRACTICAL-12', title: '운영 품질과 배포 관리', desc: '개발 산출물을 운영 가능한 품질로 유지하기 위한 점검과 배포 기준을 세운다.', time: '5.0시간', topics: 5, difficulty: '난이도 상', keywords: ['ATC', 'Code Inspector', 'ABAP Unit', 'Transport Request'] },
    { id: 'PRACTICAL-13', title: 'RAP + Fiori 실무 Capstone', desc: 'CDS/RAP/Fiori Elements를 결합해 실무형 End-to-End 앱을 완성한다.', time: '7.7시간', topics: 7, difficulty: '난이도 상', keywords: ['Scenario', 'Entity Model', 'Association', 'Composition', 'ZI_*'] }

};

const moduleListEl = document.getElementById('moduleList');
const detailContentEl = document.getElementById('detailContent');
const sidebarHeaderEl = document.getElementById('sidebarHeader');
const tabs = document.querySelectorAll('.md-tab');

let currentTrack = 'track1';
let activeModuleId = null;

function renderList(trackKey) {
  const data = curriculumData[trackKey];
  sidebarHeaderEl.textContent = `${data.length}개 섹션`;
  
  moduleListEl.innerHTML = '';
  data.forEach((item) => {
    const div = document.createElement('div');
    div.className = `md-list-item ${item.id === activeModuleId ? 'active' : ''}`;
    div.dataset.id = item.id;
    
    div.innerHTML = `
      <div class="md-item-id">${item.id}</div>
      <div class="md-item-title">${item.title}</div>
      <div class="md-item-meta">
        <span>⏱ ${item.time}</span>
        <span>·</span>
        <span>📚 ${item.topics} 단위</span>
      </div>
    `;
    
    div.addEventListener('click', () => {
      activeModuleId = item.id;
      document.querySelectorAll('.md-list-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      renderDetail(item);
    });
    
    moduleListEl.appendChild(div);
  });
}

function renderDetail(item) {
  if (!item) return;
  
  const keywordsHtml = item.keywords.map(kw => `<span class="kw-tag">${kw}</span>`).join('');
  
  // Re-trigger animation by cloning and replacing node
  const containerHtml = `
    <div class="md-detail-container" id="detailContainer">
      <div class="detail-eyebrow">${item.id}</div>
      <h2 class="detail-title">${item.title}</h2>
      <p class="detail-desc">${item.desc}</p>
      
      <div class="detail-badges">
        <span class="d-badge time">⏱ 권장 ${item.time}</span>
        <span class="d-badge topics">📚 ${item.topics}개 학습 단위</span>
        <span class="d-badge diff">📈 ${item.difficulty}</span>
      </div>

      <div class="detail-keywords">
        <h4>핵심 키워드</h4>
        <div class="kw-list">
          ${keywordsHtml}
        </div>
      </div>

      <!-- Placeholder for detail units -->
      <div class="detail-units-placeholder">
        <div class="placeholder-header">
          <h3>세부 학습 단위 목차</h3>
          <p>향후 추가될 ${item.topics}개의 세부 학습 흐름 영역입니다.</p>
        </div>
        <div class="unit-mock-list">
          <div class="unit-mock-item">
            <span class="unit-mock-num">01</span>
            <div class="unit-mock-text long"></div>
            <div class="unit-mock-btn"></div>
          </div>
          <div class="unit-mock-item">
            <span class="unit-mock-num">02</span>
            <div class="unit-mock-text medium"></div>
            <div class="unit-mock-btn"></div>
          </div>
          <div class="unit-mock-item">
            <span class="unit-mock-num">03</span>
            <div class="unit-mock-text short"></div>
            <div class="unit-mock-btn"></div>
          </div>
        </div>
      </div>
    </div>
  `;
  
  detailContentEl.innerHTML = containerHtml;
}

// Tab Switching
tabs.forEach(tab => {
  tab.addEventListener('click', (e) => {
    tabs.forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    
    currentTrack = e.target.dataset.track;
    const data = curriculumData[currentTrack];
    activeModuleId = data[0].id; // Default to first item
    
    renderList(currentTrack);
    renderDetail(data[0]);
    
    // Scroll list to top
    moduleListEl.scrollTop = 0;
  });
});

// Init
activeModuleId = curriculumData['track1'][0].id;
renderList('track1');
renderDetail(curriculumData['track1'][0]);

</script>
</body>
</html>
