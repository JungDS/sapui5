<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABAP 커리큘럼 Harmony B (아코디언 집중형)</title>
<link rel="stylesheet" href="../../assets/common.css" />
<link rel="stylesheet" href="../../assets/shell.css" />
<script src="../../assets/common.js" defer></script>
<script src="../../assets/shell.js" defer></script>
<style>
  body { margin: 0; background: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
  .md-layout { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  .md-header {
    background: #1e293b; color: #fff; display: flex; align-items: center;
    padding: 0 32px; height: 64px; flex-shrink: 0;
  }
  .md-header h1 { font-size: 1.2rem; font-weight: 800; margin: 0 40px 0 0; }
  .md-tabs { display: flex; gap: 8px; height: 100%; }
  .md-tab {
    background: transparent; border: none; color: #94a3b8; font-weight: 700;
    padding: 0 20px; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s;
  }
  .md-tab:hover { color: #f8fafc; }
  .md-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }

  /* Body */
  .md-body { display: flex; flex: 1; overflow: hidden; }

  /* Left Sidebar */
  .md-sidebar { width: 360px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
  .sidebar-toolbar { padding: 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
  .search-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; box-sizing: border-box; }
  
  .md-list { flex: 1; overflow-y: auto; padding: 12px; }
  .md-list-item { padding: 14px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
  .md-list-item:hover { background: #f1f5f9; }
  .md-list-item.active { background: #f0f9ff; border-color: #bae6fd; }
  .md-item-id { font-size: 0.75rem; font-weight: 800; color: #0284c7; margin-bottom: 4px; }
  .md-item-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; line-height: 1.4; }

  /* Right Content */
  .md-content { flex: 1; overflow-y: auto; padding: 40px; }
  .md-detail-wrap { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  
  .detail-eyebrow { color: #0284c7; font-weight: 800; font-size: 0.9rem; margin-bottom: 8px; }
  .detail-title { font-size: 2rem; font-weight: 900; color: #0f172a; margin: 0 0 24px; }
  .detail-desc { font-size: 1.1rem; color: #475569; line-height: 1.6; margin-bottom: 40px; }

  /* Accordion Rows */
  .acc-row { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .acc-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #f8fafc; cursor: pointer; user-select: none; }
  .acc-head:hover { background: #f1f5f9; }
  .acc-title { font-size: 1.05rem; font-weight: 800; color: #1e293b; }
  .acc-meta { font-size: 0.85rem; color: #64748b; font-weight: 600; }
  .acc-toggle { color: #0284c7; font-weight: 900; }
  
  .acc-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; background: #fff; }
  .acc-row.open .acc-body { padding: 20px; max-height: 1000px; border-top: 1px dashed #e2e8f0; }
  
  .acc-body p { font-size: 0.95rem; color: #334155; line-height: 1.6; margin: 0 0 16px 0; }
  .term { border-bottom: 2px solid #bae6fd; cursor: pointer; font-weight: 600; padding: 0 2px; }
</style>
</head>
<body>

<div class="md-layout">
  <header class="md-header">
    <h1>Harmony B (아코디언 딥 리딩)</h1>
    <div class="md-tabs" id="trackTabs"></div>
  </header>
  <div class="md-body">
    <aside class="md-sidebar">
      <div class="sidebar-toolbar">
        <input type="text" class="search-input" id="searchInput" placeholder="검색어 입력..." />
      </div>
      <div class="md-list" id="moduleList"></div>
    </aside>
    <main class="md-content">
      <div class="md-detail-wrap" id="detailContent"></div>
    </main>
  </div>
</div>

<script src="abap-curriculum-data.js"></script>
<script>
let currentTrack = 'track1';
let activeModuleId = null;

const tabsEl = document.getElementById('trackTabs');
const listEl = document.getElementById('moduleList');
const detailEl = document.getElementById('detailContent');
const searchInput = document.getElementById('searchInput');

initTabs();
selectTrack('track1');

function initTabs() {
  Object.keys(curData).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'md-tab';
    btn.textContent = curData[key].title;
    btn.onclick = () => selectTrack(key);
    tabsEl.appendChild(btn);
  });
}

function selectTrack(trackKey) {
  currentTrack = trackKey;
  Array.from(tabsEl.children).forEach((btn, idx) => {
    btn.classList.toggle('active', Object.keys(curData)[idx] === trackKey);
  });
  const modules = curData[trackKey].modules;
  if(modules.length > 0) activeModuleId = modules[0].id;
  renderList();
  renderDetail();
}

function renderList(filter = '') {
  listEl.innerHTML = '';
  curData[currentTrack].modules.forEach(mod => {
    if (filter && !mod.title.toLowerCase().includes(filter.toLowerCase())) return;
    const div = document.createElement('div');
    div.className = `md-list-item ${mod.id === activeModuleId ? 'active' : ''}`;
    div.innerHTML = `<div class="md-item-id">${mod.id}</div><div class="md-item-title">${mod.title}</div>`;
    div.onclick = () => {
      activeModuleId = mod.id;
      renderList(filter);
      renderDetail();
    };
    listEl.appendChild(div);
  });
}

searchInput.addEventListener('input', (e) => renderList(e.target.value));

window.toggleAccordion = function(el) {
  const row = el.closest('.acc-row');
  row.classList.toggle('open');
  const toggleBtn = row.querySelector('.acc-toggle');
  toggleBtn.textContent = row.classList.contains('open') ? '접기 ▲' : '펼치기 ▼';
};

function renderDetail() {
  const mod = curData[currentTrack].modules.find(m => m.id === activeModuleId);
  if(!mod) return;
  
  let html = `
    <div class="detail-eyebrow">${mod.id}</div>
    <h2 class="detail-title">${mod.title}</h2>
    <p class="detail-desc">${mod.desc}</p>
    <div class="units-container">
  `;
  
  if(mod.units && mod.units.length > 0) {
    mod.units.forEach(unit => {
      html += `
        <div class="acc-row">
          <div class="acc-head" onclick="toggleAccordion(this)">
            <div class="acc-title">${unit.id} · ${unit.title}</div>
            <div style="display:flex; gap:16px; align-items:center;">
              <span class="acc-meta">⏱ ${unit.time}</span>
              <span class="acc-toggle">펼치기 ▼</span>
            </div>
          </div>
          <div class="acc-body">
            <p><strong>목표:</strong> ${unit.objective || ''}</p>
            <p>${unit.content || ''}</p>
            <p style="color:#b45309;">⚠️ ${unit.warning || ''}</p>
          </div>
        </div>
      `;
    });
  } else {
    html += `<div>단위 정보 없음</div>`;
  }
  
  html += `</div>`;
  detailEl.innerHTML = html;
}
</script>
</body>
</html>
